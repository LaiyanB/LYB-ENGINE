<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYB Engine 2.0</title>
    <style>
        :root {
            --bg: #040b16;
            --bg-2: #071221;
            --panel: rgba(6, 13, 26, 0.86);
            --panel-2: rgba(10, 19, 34, 0.68);
            --panel-3: rgba(12, 24, 42, 0.54);
            --border: rgba(148, 163, 184, 0.16);
            --border-strong: rgba(245, 158, 11, 0.46);
            --text: #eff6ff;
            --muted: #9fb4c9;
            --muted-2: #60748a;
            --accent: #f59e0b;
            --accent-2: #38bdf8;
            --danger: #fb7185;
            --success: #34d399;
            --window-gap: 0px;
            --shell-radius: clamp(18px, 1.6vw, 26px);
            --card-radius: clamp(16px, 1.4vw, 22px);
            --section-gap: clamp(10px, 1vw, 14px);
            --page-pad: clamp(12px, 1.2vw, 18px);
            --title-size: clamp(1.4rem, 2vw, 2rem);
            --copy-size: clamp(0.76rem, 0.78vw, 0.85rem);
        }

        * { box-sizing: border-box; }

        html,
        body,
        #root {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.15), transparent 32%),
                radial-gradient(circle at top right, rgba(245, 158, 11, 0.12), transparent 24%),
                linear-gradient(160deg, #02060e 0%, #07101d 45%, #050c17 100%);
            color: var(--text);
            font-size: clamp(14px, 0.78vw, 16px);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: auto;
            border-radius: 999px;
            pointer-events: none;
            opacity: 0.5;
        }

        body::before {
            width: 30vw;
            height: 30vw;
            min-width: 260px;
            min-height: 260px;
            top: -10vw;
            right: -8vw;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.16), transparent 68%);
        }

        body::after {
            width: 26vw;
            height: 26vw;
            min-width: 220px;
            min-height: 220px;
            bottom: -8vw;
            left: -6vw;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.14), transparent 70%);
        }

        #root {
            height: 100%;
            padding: var(--window-gap);
        }

        button, input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .app-shell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 0;
            border-radius: var(--shell-radius);
            background:
                linear-gradient(180deg, rgba(8, 16, 29, 0.96), rgba(3, 8, 18, 0.98)),
                rgba(4, 11, 22, 0.96);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
        }

        body.window-maximized .app-shell {
            border-radius: 0;
            border-left-color: transparent;
            border-right-color: transparent;
        }

        .topbar, .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--section-gap);
            padding: clamp(10px, 1.2vw, 14px) clamp(12px, 1.4vw, 18px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0));
        }

        .footer {
            border-bottom: 0;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
            padding-top: clamp(8px, 1vw, 12px);
            padding-bottom: clamp(8px, 1vw, 12px);
        }

        .topbar {
            cursor: default;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: clamp(12px, 1vw, 16px);
            min-width: 0;
        }

        .brand-badge {
            width: clamp(40px, 2.8vw, 48px);
            height: clamp(40px, 2.8vw, 48px);
            border-radius: 18px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(135deg, rgba(245, 158, 11, 0.94), rgba(56, 189, 248, 0.84));
            color: white;
            box-shadow:
                0 14px 32px rgba(15, 23, 42, 0.32),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            flex: 0 0 auto;
        }

        .brand-title {
            margin: 0;
            font-size: clamp(20px, 1.7vw, 28px);
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .brand-title span {
            color: var(--accent);
        }

        .brand-subtitle,
        .eyebrow {
            margin: 0;
            font-size: clamp(9px, 0.55vw, 11px);
            font-weight: 800;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--muted-2);
        }

        .pill {
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(5, 13, 25, 0.75);
            color: #dbeafe;
            font-size: clamp(9px, 0.58vw, 11px);
            font-weight: 900;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .window-btn {
            width: 38px;
            height: 38px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(148, 163, 184, 0.12);
            background: rgba(9, 16, 29, 0.8);
            color: var(--muted);
            transition: 0.16s ease;
        }

        .window-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(148, 163, 184, 0.26);
            background: rgba(18, 30, 49, 0.9);
            color: white;
        }

        .window-btn.close:hover {
            border-color: rgba(251, 113, 133, 0.4);
            background: rgba(127, 29, 29, 0.88);
        }

        .content {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .page {
            height: 100%;
            padding: var(--page-pad);
        }

        .grid-two {
            height: 100%;
            display: grid;
            grid-template-columns: minmax(280px, 0.86fr) minmax(0, 1.34fr);
            gap: var(--section-gap);
        }

        .column {
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: var(--section-gap);
        }

        .card {
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--card-radius);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0)),
                rgba(5, 12, 24, 0.74);
            padding: clamp(12px, 1.2vw, 16px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .card-title {
            margin: 0 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(10px, 0.62vw, 12px);
            font-weight: 900;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--accent-2);
        }

        .hardware-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mini-card {
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.08);
            background: rgba(10, 19, 34, 0.82);
        }

        /* 硬件扫描卡片：拉伸填满列高，内容饱满 */
        .hardware-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .hw-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
        }

        .hw-row + .hw-row {
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }

        .hw-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-2);
            flex: 0 0 auto;
        }

        .hw-row .label {
            font-size: 0.68rem;
        }

        .hw-row .value {
            margin-top: 4px;
            font-size: clamp(13px, 0.9vw, 15px);
            line-height: 1.45;
        }

        .hw-status {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted-2);
        }

        .hw-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--success);
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
        }

        .hw-status .dot.off {
            background: var(--muted-2);
            box-shadow: none;
        }

        .label {
            margin: 0;
            font-size: clamp(8px, 0.5vw, 10px);
            font-weight: 800;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--muted-2);
        }

        .value {
            margin: 6px 0 0;
            font-size: clamp(13px, 0.9vw, 15px);
            font-weight: 800;
            color: white;
            word-break: break-word;
        }

        .main-scroll {
            min-height: 0;
            overflow: auto;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .main-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .main-scroll::-webkit-scrollbar-thumb {
            background: rgba(87, 112, 138, 0.86);
            border-radius: 999px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .options-grid.two {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .options-grid.three {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .options-grid.four {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            background: rgba(9, 17, 31, 0.72);
            transition: 0.2s ease;
        }

        .option:hover {
            transform: translateY(-1px);
            border-color: rgba(245, 158, 11, 0.24);
            background: rgba(13, 24, 41, 0.92);
        }

        .option.disabled {
            opacity: 0.42;
            cursor: not-allowed;
        }

        .option input {
            margin-top: 2px;
            width: 15px;
            height: 15px;
            accent-color: var(--accent);
        }

        .option h4 {
            margin: 0;
            font-size: clamp(12px, 0.85vw, 13px);
            font-weight: 800;
            color: white;
        }

        .option p {
            margin: 3px 0 0;
            font-size: 0.72rem;
            line-height: 1.45;
            color: var(--muted);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 14px;
            font-size: clamp(10px, 0.62vw, 12px);
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: 0.18s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.98), rgba(56, 189, 248, 0.92));
            color: #03111f;
            box-shadow: 0 16px 34px rgba(14, 23, 42, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
        }

        .btn-secondary {
            border: 1px solid rgba(148, 163, 184, 0.12);
            background: rgba(11, 19, 34, 0.78);
            color: var(--muted);
        }

        .btn-secondary:hover {
            background: rgba(20, 32, 51, 0.96);
            color: white;
        }

        .step-two {
            position: relative;
            padding: 0;
            background:
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.12), transparent 30%),
                radial-gradient(circle at bottom left, rgba(245, 158, 11, 0.1), transparent 26%),
                linear-gradient(170deg, #01050b 0%, #04101d 55%, #020810 100%);
        }

        .step-two-inner,
        .step-three-inner {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: var(--page-pad);
        }

        .step-two-inner {
            padding: 0;
        }

        .step-two .header-stack {
            position: absolute;
            top: clamp(22px, 1.8vw, 30px);
            left: clamp(20px, 1.8vw, 30px);
            z-index: 3;
            max-width: min(520px, 42vw);
        }

        .target-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: minmax(0, 1fr);
            align-items: stretch;
            align-content: stretch;
            gap: 14px;
            padding: 4px 0 0;
        }

        .step-two .target-grid {
            position: absolute;
            inset: 0;
            padding: 0 clamp(8px, 0.8vw, 14px);
            gap: clamp(10px, 0.8vw, 14px);
        }

        .target {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
                rgba(255, 255, 255, 0.04);
            text-align: left;
            color: white;
            transition: 0.2s ease;
            min-height: 0;
            height: 100%;
        }

        .target:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.24);
            background: rgba(255, 255, 255, 0.12);
        }

        .target.active {
            border-color: var(--accent);
            box-shadow: 0 0 24px rgba(245, 158, 11, 0.24), inset 0 0 40px rgba(245, 158, 11, 0.06);
            background: rgba(245, 158, 11, 0.08);
        }

        .target.active .logo-wrap img {
            transform: scale(1.06);
        }

        .target .logo-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            padding: 6px 8px;
        }

        .target .logo-wrap img {
            max-width: 72%;
            max-height: 55%;
            object-fit: contain;
            transition: transform 0.25s ease;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
        }

        .target:hover .logo-wrap img {
            transform: scale(1.1);
        }

        .target .target-label {
            text-align: center;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            width: 100%;
        }

        .target .target-label .eyebrow {
            margin: 0 0 2px;
            font-size: 0.7rem;
        }

        .target .target-label h3 {
            margin: 0;
            font-size: clamp(13px, 0.95vw, 17px);
            font-weight: 700;
        }

        .target .target-label p {
            margin: 4px 0 0;
            font-size: 0.72rem;
            opacity: 0.6;
            color: rgba(226, 232, 240, 0.7);
        }

        .step-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-top: 4px;
        }

        .step-two .step-footer {
            position: absolute;
            left: clamp(20px, 1.8vw, 30px);
            right: clamp(20px, 1.8vw, 30px);
            bottom: clamp(18px, 1.6vw, 26px);
            z-index: 2;
            padding-top: 0;
        }

        .step-three-layout {
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
        }

        .profile-card {
            margin: auto;
            width: 100%;
            max-width: 1040px;
            border-radius: 22px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0)),
                rgba(4, 12, 23, 0.76);
            padding: clamp(12px, 1.2vw, 16px);
        }

        .footer-left,
        .footer-right {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            font-size: clamp(9px, 0.56vw, 11px);
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted-2);
        }

        .footer-right {
            justify-content: flex-end;
        }

        .footer-right span,
        .footer-left span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-note {
            color: var(--muted);
            font-size: var(--copy-size);
            line-height: 1.7;
        }

        .accent-line {
            width: 112px;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            margin-top: 14px;
        }

        .header-stack h2 {
            margin: 10px 0 0;
            font-size: var(--title-size);
            font-weight: 900;
            letter-spacing: -0.04em;
            color: white;
        }

        .target-title {
            font-size: clamp(30px, 3.2vw, 44px) !important;
            letter-spacing: 0.16em !important;
        }

        .chip {
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #bae6fd;
            font-size: clamp(9px, 0.56vw, 11px);
            font-weight: 900;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .cta {
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.28);
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
            vertical-align: middle;
        }

        @media (max-width: 1280px) {
            .grid-two {
                grid-template-columns: minmax(260px, 0.92fr) minmax(0, 1.2fr);
            }

            .options-grid,
            .options-grid.two,
            .options-grid.three,
            .options-grid.four {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 1120px) {
            .target-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: repeat(2, minmax(0, 1fr));
            }

            .step-two .target-grid {
                padding: 0 clamp(8px, 0.8vw, 14px);
            }
        }

        /* 中等高度屏（1080p 等）：进一步压缩让三步内容一屏放下 */
        @media (max-height: 900px) {
            .profile-header {
                padding-bottom: 8px;
            }

            .profile-header h2 {
                font-size: 22px !important;
                margin-top: 4px !important;
            }

            .profile-card {
                padding: 10px 12px;
            }

            .card-title {
                margin-bottom: 8px;
            }

            .option {
                padding: 8px 10px;
            }

            .option h4 {
                font-size: 12px;
            }

            .option p {
                font-size: 0.68rem;
                margin-top: 2px;
            }

            .scan-interval-card .card-subtitle,
            .custom-card .card-subtitle {
                margin: 2px 0 8px;
                font-size: 0.78rem;
            }

            .interval-chip {
                padding: 3px 8px;
                font-size: 0.72rem;
            }

            .interval-hint {
                margin: 8px 0 0;
                font-size: 0.76rem;
            }

            .custom-item {
                padding: 6px 10px;
            }

            .step-three-layout {
                gap: 8px;
            }

            .step-footer {
                padding-top: 0;
            }
        }

        @media (max-width: 980px), (max-height: 760px) {
            body {
                overflow: auto;
            }

            #root {
                padding: 0;
            }

            .app-shell {
                width: 100%;
                height: auto;
                min-height: 100vh;
                border-radius: 0;
            }

            .grid-two,
            .target-grid,
            .options-grid,
            .options-grid.two,
            .options-grid.three,
            .options-grid.four {
                grid-template-columns: 1fr;
            }

            .target-grid {
                grid-template-rows: none;
                padding: 12px 0;
            }

            .target {
                height: auto;
                min-height: 200px;
            }

            .step-two .header-stack {
                position: static;
                max-width: none;
                padding: var(--page-pad) var(--page-pad) 0;
            }

            .step-two .target-grid {
                position: static;
                inset: auto;
                padding: 12px var(--page-pad);
            }

            .step-two .step-footer {
                position: static;
                left: auto;
                right: auto;
                bottom: auto;
                padding: 6px var(--page-pad) var(--page-pad);
            }

            .topbar,
            .footer,
            .step-footer,
            .profile-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .topbar-right {
                width: 100%;
                justify-content: space-between;
            }

            .footer-right {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 720px) {
            .window-controls {
                width: 100%;
                justify-content: flex-end;
            }

            .target {
                min-height: 180px;
                height: auto;
            }
        }

        /* ── 扫描间隔设置（对齐颗粒度） ── */
        .scan-interval-card {
            margin-top: 0;
        }

        .scan-interval-card .card-subtitle {
            margin: 4px 0 16px;
            font-size: 0.88rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .scan-interval-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
        }

        .interval-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .interval-chip {
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel-3);
            color: var(--text);
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .interval-chip:hover {
            border-color: var(--accent);
            background: rgba(245, 158, 11, 0.12);
        }

        .interval-chip.active {
            border-color: var(--accent);
            background: rgba(245, 158, 11, 0.18);
            color: var(--accent);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
        }

        .interval-custom {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .interval-custom label {
            white-space: nowrap;
        }

        .interval-input {
            width: 70px;
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: border-color 0.15s;
            -moz-appearance: textfield;
        }

        .interval-input::-webkit-inner-spin-button,
        .interval-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .interval-input:focus {
            border-color: var(--accent-2);
        }

        .interval-hint {
            margin: 12px 0 0;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .interval-hint strong {
            color: var(--accent);
            font-weight: 700;
        }

        /* ── 优化方案（预设） ── */
        .preset-hint {
            margin: 0 0 14px;
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .preset-card {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--panel-3);
            color: var(--text);
            text-align: left;
            transition: all 0.18s;
        }

        .preset-card:hover {
            border-color: var(--accent);
            background: rgba(245, 158, 11, 0.1);
            transform: translateY(-1px);
        }

        .preset-card.active {
            border-color: var(--accent);
            background: rgba(245, 158, 11, 0.18);
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.22);
        }

        .preset-name {
            font-size: 0.88rem;
            font-weight: 800;
            color: white;
        }

        .preset-card.active .preset-name {
            color: var(--accent);
        }

        .preset-desc {
            font-size: 0.64rem;
            color: var(--muted-2);
            line-height: 1.35;
        }

        /* ── 自定义进程压制 ── */
        .custom-card {
            margin-top: 0;
        }

        .custom-add-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .custom-input {
            flex: 1;
            min-width: 160px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .custom-input:focus {
            border-color: var(--accent-2);
        }

        .custom-priority {
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        .custom-list {
            list-style: none;
            margin: 14px 0 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .custom-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel-2);
        }

        .custom-item-name {
            flex: 1;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            word-break: break-all;
        }

        .custom-item-pri {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.14);
            color: #bae6fd;
        }

        .custom-item-del {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: rgba(251, 113, 133, 0.12);
            color: var(--danger);
            transition: 0.15s;
        }

        .custom-item-del:hover {
            background: rgba(251, 113, 133, 0.26);
            color: #fecdd3;
        }

        .custom-empty {
            margin: 14px 0 0;
            font-size: 0.85rem;
            color: var(--muted-2);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const gameNames = {
            delta: "三角洲行动",
            pubg: "绝地求生",
            valorant: "无畏契约",
            cs2: "CS2"
        };

        const iconPaths = {
            rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.71.79-1.81.2-2.55L4.5 16.5z M16.5 4.5c1.5-1.26 2-5 2-5s-3.74.5-5 2c-.71.71-.79 1.81-.2 2.55l3.2 3.2z M15 15l-3.5-3.5 M8 20l2-2 M20 8l-2 2 M9 15L4 10l11-6 6 6-6 11-5-5z" />',
            activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2" />',
            chevronRight: '<path d="m9 18 6-6-6-6" />',
            chevronLeft: '<path d="m15 18-6-6 6-6" />',
            shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />',
            zap: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />',
            lock: '<rect width="18" height="11" x="3" y="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />',
            alert: '<circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" />',
            cpu: '<rect width="16" height="16" x="4" y="4" rx="2" /><path d="M9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" />',
            monitor: '<rect width="20" height="14" x="2" y="3" rx="2" /><path d="M8 21h8M12 17v4" />',
            minus: '<path d="M5 12h14" />',
            square: '<rect x="6" y="6" width="12" height="12" rx="1.5" />',
            restore: '<path d="M9 9h10v10H9z" /><path d="M5 15V5h10" />',
            close: '<path d="M18 6L6 18M6 6l12 12" />'
        };

        const defaultState = {
            running: false,
            selectedGame: "valorant",
            statusText: "等待确认...",
            hardware: {
                cpu: "检测中...",
                gpu: "检测中...",
                ramSpeed: 0,
                memoryLabel: "检测中...",
                hybrid: false,
                hpetAvailable: true
            },
            window: {
                maximized: false,
                dpi: 96
            },
            settings: {
                sysPower: true,
                sysVbs: true,
                sysVsync: true,
                edgeSuppress: true,
                disableHpet: false,
                gameDvr: true,
                gameMode: true,
                qosLimit: false,
                timerRes: true,
                systemAnim: false,
                aceSuppress: true,
                weGameSuppress: true,
                gameAvoid: true,
                steamSuppress: true,
                gameFullCore: true,
                disableEcores: false,
                avoidLastCore: true,
                scanInterval: 60,
                customTargets: []
            }
        };

        // 预设方案：一键套用整套配置
        const presets = {
            balanced: {
                label: "均衡",
                desc: "常用优化，兼顾稳定与性能",
                settings: {
                    sysPower: true, sysVbs: true, sysVsync: true, edgeSuppress: true, disableHpet: true,
                    gameDvr: true, gameMode: true, qosLimit: false, timerRes: true, systemAnim: false,
                    aceSuppress: true, weGameSuppress: true, gameAvoid: true,
                    steamSuppress: true, gameFullCore: true, disableEcores: false, avoidLastCore: true,
                    scanInterval: 60
                }
            },
            aggressive: {
                label: "激进",
                desc: "全力压榨性能，追求极致帧率",
                settings: {
                    sysPower: true, sysVbs: true, sysVsync: true, edgeSuppress: true, disableHpet: true,
                    gameDvr: true, gameMode: true, qosLimit: true, timerRes: true, systemAnim: true,
                    aceSuppress: true, weGameSuppress: true, gameAvoid: true,
                    steamSuppress: true, gameFullCore: true, disableEcores: true, avoidLastCore: true,
                    scanInterval: 10
                }
            },
            conservative: {
                label: "保守",
                desc: "最小干预，优先稳定性",
                settings: {
                    sysPower: true, sysVbs: false, sysVsync: true, edgeSuppress: false, disableHpet: false,
                    gameDvr: false, gameMode: false, qosLimit: false, timerRes: false, systemAnim: false,
                    aceSuppress: false, weGameSuppress: false, gameAvoid: true,
                    steamSuppress: false, gameFullCore: true, disableEcores: false, avoidLastCore: false,
                    scanInterval: 120
                }
            }
        };

        const app = {
            root: document.getElementById("root"),
            step: 1,
            isNative: Boolean(window.chrome && window.chrome.webview),
            state: JSON.parse(JSON.stringify(defaultState)),
            profile: "balanced"
        };

        function icon(name, size) {
            const path = iconPaths[name] || "";
            return '<svg class="icon" xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + "</svg>";
        }

        function isTencentGame(gameId) {
            return gameId === "valorant" || gameId === "delta";
        }

        function mergeState(nextState) {
            app.state = {
                ...app.state,
                ...nextState,
                hardware: {
                    ...app.state.hardware,
                    ...(nextState.hardware || {})
                },
                window: {
                    ...app.state.window,
                    ...(nextState.window || {})
                },
                settings: {
                    ...app.state.settings,
                    ...(nextState.settings || {})
                }
            };
        }

        function sendMessage(message) {
            if (app.isNative) {
                window.chrome.webview.postMessage(message);
            }
        }

        function sendWindowCommand(command) {
            sendMessage("window|" + command);
        }

        function updateSetting(key, enabled) {
            if (key === "disableHpet" && !app.state.hardware.hpetAvailable) {
                return;
            }
            if (key === "disableEcores" && !app.state.hardware.hybrid) {
                return;
            }

            app.state.settings[key] = enabled;
            app.profile = "custom";
            sendMessage("setting|" + key + "|" + (enabled ? "1" : "0"));
            render();
        }

        function updateNumericSetting(key, value) {
            var num = parseInt(value, 10);
            if (isNaN(num) || num < 5) num = 5;
            if (num > 300) num = 300;
            app.state.settings[key] = num;
            app.profile = "custom";
            sendMessage("setting|" + key + "|" + num);
            render();
        }

        // 一键套用预设方案
        function applyPreset(name) {
            const preset = presets[name];
            if (!preset) {
                return;
            }

            Object.keys(preset.settings).forEach(function(key) {
                const value = preset.settings[key];
                if (key === "scanInterval") {
                    app.state.settings[key] = value;
                    sendMessage("setting|" + key + "|" + value);
                    return;
                }
                if (key === "disableHpet" && !app.state.hardware.hpetAvailable) {
                    return;
                }
                if (key === "disableEcores" && !app.state.hardware.hybrid) {
                    return;
                }
                app.state.settings[key] = value;
                sendMessage("setting|" + key + "|" + (value ? "1" : "0"));
            });

            app.profile = name;
            render();
        }

        function selectGame(gameId) {
            app.state.selectedGame = gameId;
            sendMessage("game|" + gameId);
            render();
        }

        function toggleExecution() {
            if (!app.isNative) {
                app.state.running = !app.state.running;
                var iv = Number(app.state.settings.scanInterval) || 60;
                app.state.statusText = app.state.running
                    ? "守护已启动。游戏进程每 " + iv + " 秒检查一次，平台进程每 " + (iv + 1) + " 秒检查一次。"
                    : "守护已停止，原始系统设置已恢复。";
                render();
            }
            sendMessage("action|execute");
        }

        function optionCard(key, title, description, disabled) {
            const checked = !!app.state.settings[key];
            return [
                '<label class="option', disabled ? ' disabled' : '', '">',
                '<input type="checkbox" data-setting="', key, '" ', checked ? "checked" : "", disabled ? " disabled" : "", " />",
                '<div><h4>', title, disabled ? " " + icon("alert", 12) : "", '</h4><p>', description, "</p></div>",
                "</label>"
            ].join("");
        }

        function renderWindowControls() {
            if (!app.isNative) {
                return "";
            }

            return [
                '<div class="window-controls" data-no-drag="1">',
                '<button class="window-btn" type="button" data-window="minimize" aria-label="最小化">', icon("minus", 14), "</button>",
                '<button class="window-btn" type="button" data-window="toggleMaximize" aria-label="', app.state.window.maximized ? "还原" : "最大化", '">',
                app.state.window.maximized ? icon("restore", 14) : icon("square", 14),
                "</button>",
                '<button class="window-btn close" type="button" data-window="close" aria-label="关闭">', icon("close", 14), "</button>",
                "</div>"
            ].join("");
        }

        function formatScaleLabel() {
            const dpi = Number(app.state.window.dpi) || 96;
            return "缩放 " + Math.round(dpi / 96 * 100) + "%";
        }

        function renderStepOne() {
            const options = [
                ["sysPower", "卓越性能电源计划", "切换到高性能电源配置，减少降频和节能干扰。", false],
                ["sysVbs", "关闭 VBS", "释放虚拟化安全占用的 CPU 资源。", false],
                ["sysVsync", "关闭全局垂直同步", "降低竞技游戏中的输入延迟。", false],
                ["edgeSuppress", "限制 Edge 后台", "避免 Edge 在后台占用额外的内存和 CPU。", false],
                ["disableHpet", "关闭 HPET", app.state.hardware.hpetAvailable ? "在 AMD 平台上通常更适合降低中断延迟。" : "Intel 平台一般不需要改这个选项。", !app.state.hardware.hpetAvailable],
                ["gameDvr", "禁用 GameDVR 录制", "关闭 Xbox 后台录制与截图，减少后台开销。", false],
                ["gameMode", "开启系统游戏模式", "让系统优先为游戏分配资源。", false],
                ["qosLimit", "禁用 QoS 带宽预留", "释放默认预留的 20% 网络带宽（需管理员权限）。", false],
                ["timerRes", "高精度计时器", "守护期间将系统计时器精度提升到 1ms。", false],
                ["systemAnim", "关闭系统动画", "减少菜单/窗口动画的视觉开销。", false]
            ];

            const presetCards = Object.keys(presets).map(function(name) {
                const preset = presets[name];
                return [
                    '<button class="preset-card', app.profile === name ? " active" : "", '" data-preset="', name, '">',
                    '<span class="preset-name">', preset.label, "</span>",
                    '<span class="preset-desc">', preset.desc, "</span>",
                    "</button>"
                ].join("");
            }).join("");

            const profileLabel = presets[app.profile] ? presets[app.profile].label : "自定义";

            return [
                '<div class="page"><div class="grid-two">',
                '<div class="column">',
                '<section class="card hardware-card">',
                '<h3 class="card-title">', icon("activity", 16), " 硬件扫描</h3>",
                '<div class="hw-row">',
                '<div class="hw-icon">', icon("cpu", 20), "</div>",
                '<div style="min-width:0"><p class="label">处理器</p><p class="value">', escapeHtml(app.state.hardware.cpu), "</p></div>",
                "</div>",
                '<div class="hw-row">',
                '<div class="hw-icon">', icon("monitor", 20), "</div>",
                '<div style="min-width:0"><p class="label">显卡</p><p class="value">', escapeHtml(app.state.hardware.gpu), "</p></div>",
                "</div>",
                '<div class="hardware-grid" style="margin-top:4px">',
                '<div class="mini-card"><p class="label">内存频率</p><p class="value">', escapeHtml(app.state.hardware.memoryLabel), "</p></div>",
                '<div class="mini-card"><p class="label">大小核</p><p class="value">', app.state.hardware.hybrid ? "是" : "否", "</p></div>",
                "</div>",
                '<div class="hw-status">',
                '<span>优化方案 · ', escapeHtml(profileLabel), "</span>",
                '<span><span class="dot', app.state.running ? "" : " off", '"></span>', app.state.running ? "守护运行中" : "守护未启动", "</span>",
                "</div>",
                "</section>",
                "</div>",
                '<div class="column">',
                '<div class="header-stack"><p class="eyebrow">步骤 01</p><h2>全局系统优化</h2></div>',
                '<div class="main-scroll">',
                '<section class="card">',
                '<h3 class="card-title">', icon("zap", 16), " 优化方案</h3>",
                '<p class="preset-hint">一键套用，之后仍可手动微调。</p>',
                '<div class="preset-grid">', presetCards, "</div>",
                "</section>",
                '<section class="card">',
                '<h3 class="card-title">', icon("activity", 16), " 手动微调</h3>",
                '<div class="options-grid four">',
                options.map(function(item) { return optionCard(item[0], item[1], item[2], item[3]); }).join(""),
                '</div></section>',
                "</div>",
                '<div class="actions"><button class="btn btn-primary" data-step="2">下一步：选择游戏 ', icon("chevronRight", 18), "</button></div>",
                "</div></div></div>"
            ].join("");
        }

        function renderStepTwo() {
            const gameLogoMap = {
                valorant: "valorant_logo.png",
                delta: "deltaforce_logo.png",
                cs2: "cs2_logo.png",
                pubg: "pubg_logo.png"
            };
            const targets = Object.keys(gameNames).map(function(gameId) {
                const active = app.state.selectedGame === gameId;
                return [
                    '<button class="target', active ? " active" : "", '" data-game="', gameId, '">',
                    '<div class="logo-wrap"><img src="', gameLogoMap[gameId], '" alt="', gameNames[gameId], '" draggable="false" /></div>',
                    '<div class="target-label">',
                    '<p class="eyebrow">目标游戏</p>',
                    "<h3>", gameNames[gameId], "</h3>",
                    "<p>", active ? "当前已选中" : "点击切换", "</p>",
                    "</div></button>"
                ].join("");
            }).join("");

            return [
                '<div class="page step-two">',
                '<div class="step-two-inner">',
                '<div class="header-stack"><p class="eyebrow">步骤 02</p><h2 class="target-title">选择目标游戏</h2><div class="accent-line"></div></div>',
                '<div class="target-grid">', targets, "</div>",
                '<div class="step-footer">',
                '<button class="btn btn-secondary" data-step="1">', icon("chevronLeft", 14), " 返回</button>",
                '<button class="btn btn-primary" data-step="3">进入游戏配置</button>',
                "</div></div></div>"
            ].join("");
        }

        function renderStepThree() {
            const options = isTencentGame(app.state.selectedGame)
                ? [
                    ["aceSuppress", "ACE 进程压制", "把 ACE 相关进程尽量压到最不重要的核心上。", false],
                    ["weGameSuppress", "WeGame 压制", "把 browser.exe 和 wegame.exe 压到最后一个核心，并降低优先级。", false],
                    ["gameAvoid", "游戏进程优先", "提升主游戏进程优先级，并尽量避开被压制的核心。", false],
                    ["avoidLastCore", "游戏避开最后一核", "让游戏进程不使用最后一个核心，为压制进程留出隔离区。", false],
                    ["disableEcores", "减少 E 核干扰", app.state.hardware.hybrid ? "在大小核 CPU 上尽量把游戏固定到性能核心。" : "当前 CPU 不是大小核架构，不需要开启。", !app.state.hardware.hybrid]
                ]
                : [
                    ["steamSuppress", "Steam 后台压制", "降低 Steam 与 WebHelper 后台进程的干扰。", false],
                    ["gameFullCore", "游戏进程优先", "提升主游戏进程优先级，并尽量避开被压制的核心。", false],
                    ["avoidLastCore", "游戏避开最后一核", "让游戏进程不使用最后一个核心，为压制进程留出隔离区。", false],
                    ["disableEcores", "减少 E 核干扰", app.state.hardware.hybrid ? "在大小核 CPU 上尽量把游戏固定到性能核心。" : "当前 CPU 不是大小核架构，不需要开启。", !app.state.hardware.hybrid]
                ];

            const scanPresets = [10, 15, 20, 30, 45, 60, 90, 120];
            const curInterval = Number(app.state.settings.scanInterval) || 60;

            const customTargets = app.state.settings.customTargets || [];
            const customListHtml = customTargets.length
                ? '<ul class="custom-list">' + customTargets.map(function(target, index) {
                    const priorityLabels = ["空闲", "低于正常", "正常"];
                    const priorityLabel = priorityLabels[target.priority] || "空闲";
                    return [
                        '<li class="custom-item">',
                        '<span class="custom-item-name">', escapeHtml(target.name), "</span>",
                        '<span class="custom-item-pri">', priorityLabel, "</span>",
                        '<button class="custom-item-del" type="button" data-custom-remove="', index, '" aria-label="删除">', icon("close", 12), "</button>",
                        "</li>"
                    ].join("");
                }).join("") + "</ul>"
                : '<p class="custom-empty">还没有自定义进程，添加一个试试（如 chrome.exe）。</p>';

            return [
                '<div class="page">',
                '<div class="step-three-inner"><div class="step-three-layout">',
                '<div class="profile-header">',
                '<div class="brand"><div class="brand-badge">', icon("zap", 22), '</div><div><p class="eyebrow">游戏配置</p><h2 style="margin:8px 0 0;font-size:30px;font-weight:900;">', gameNames[app.state.selectedGame], "</h2></div></div>",
                '<div class="chip">', isTencentGame(app.state.selectedGame) ? "腾讯路线" : "Steam 路线", "</div>",
                "</div>",
                '<div class="main-scroll"><section class="profile-card">',
                '<h3 class="card-title">', icon("shield", 22), " 游戏专属进程控制</h3>",
                '<div class="options-grid three">', options.map(function(item) { return optionCard(item[0], item[1], item[2], item[3]); }).join(""), "</div>",
                "</section>",
                '<section class="profile-card custom-card">',
                '<h3 class="card-title">', icon("zap", 18), " 自定义进程压制</h3>",
                '<p class="card-subtitle">把任意后台进程压到最后一个核心并降低优先级，例如直播软件或通讯工具。</p>',
                '<div class="custom-add-row">',
                '<input type="text" class="custom-input" data-custom-name placeholder="进程名，如 chrome.exe" maxlength="64" />',
                '<select class="custom-priority" data-custom-priority>',
                '<option value="0">空闲</option><option value="1">低于正常</option><option value="2">正常</option>',
                "</select>",
                '<button class="btn btn-secondary" type="button" data-custom-add>添加</button>',
                "</div>",
                customListHtml,
                "</section>",
                '<section class="profile-card scan-interval-card">',
                '<h3 class="card-title">', icon("activity", 18), " 扫描间隔（对齐颗粒度）</h3>",
                '<p class="card-subtitle">设置守护循环的扫描频率。游戏进程与平台/ACE 进程自动错开 1 秒，避免资源争抢。</p>',
                '<div class="scan-interval-row">',
                '<div class="interval-presets">',
                scanPresets.map(function(v) {
                    var active = v === curInterval ? ' active' : '';
                    return '<button class="interval-chip' + active + '" data-interval="' + v + '">' + v + 's</button>';
                }).join(""),
                '</div>',
                '<div class="interval-custom">',
                '<label>自定义</label>',
                '<input type="number" class="interval-input" data-interval-input="1" min="5" max="300" value="' + curInterval + '" />',
                '<span>秒</span>',
                '</div>',
                '</div>',
                '<p class="interval-hint">✨ 游戏每 <strong>' + curInterval + 's</strong> → ACE/平台每 <strong>' + (curInterval + 1) + 's</strong>（错峰 1s，对齐颗粒度）</p>',
                "</section></div>",
                '<div class="step-footer">',
                '<button class="btn btn-secondary" data-step="2">返回游戏列表</button>',
                '<button class="btn btn-primary cta" data-action="execute">', app.state.running ? "停止守护并恢复设置" : "执行优化并启动守护", "</button>",
                "</div></div></div></div>"
            ].join("");
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function render() {
            document.body.classList.toggle("window-maximized", !!app.state.window.maximized);

            let pageHtml = "";
            if (app.step === 1) pageHtml = renderStepOne();
            if (app.step === 2) pageHtml = renderStepTwo();
            if (app.step === 3) pageHtml = renderStepThree();

            app.root.innerHTML = [
                '<div class="app-shell">',
                '<header class="topbar" data-window-drag="1">',
                '<div class="brand"><div class="brand-badge">', icon("rocket", 22), '</div><div><h1 class="brand-title">LYB Engine <span>2.0</span></h1><p class="brand-subtitle">', app.isNative ? "无边框自适应 WebView2 界面" : "浏览器预览模式", "</p></div></div>",
                '<div class="topbar-right" data-no-drag="1"><div class="pill">', app.state.running ? "守护运行中" : "界面已就绪", "</div>", renderWindowControls(), "</div>",
                "</header>",
                '<main class="content">', pageHtml, "</main>",
                '<footer class="footer">',
                '<div class="footer-left"><span>', icon("lock", 12), " ", escapeHtml(app.state.statusText), "</span></div>",
                '<div class="footer-right"><span>', icon("cpu", 12), " ", escapeHtml(app.state.hardware.memoryLabel), "</span><span>", icon("monitor", 12), " ", gameNames[app.state.selectedGame], "</span><span>", icon("activity", 12), " ", formatScaleLabel(), "</span></div>",
                "</footer></div>"
            ].join("");
        }

        app.root.addEventListener("click", function(event) {
            const windowTarget = event.target.closest("[data-window]");
            if (windowTarget) {
                sendWindowCommand(windowTarget.getAttribute("data-window"));
                return;
            }

            const presetTarget = event.target.closest("[data-preset]");
            if (presetTarget) {
                applyPreset(presetTarget.getAttribute("data-preset"));
                return;
            }

            const stepTarget = event.target.closest("[data-step]");
            if (stepTarget) {
                app.step = Number(stepTarget.getAttribute("data-step"));
                render();
                return;
            }

            const gameTarget = event.target.closest("[data-game]");
            if (gameTarget) {
                selectGame(gameTarget.getAttribute("data-game"));
                return;
            }

            const actionTarget = event.target.closest("[data-action]");
            if (actionTarget && actionTarget.getAttribute("data-action") === "execute") {
                toggleExecution();
                return;
            }

            const customAddTarget = event.target.closest("[data-custom-add]");
            if (customAddTarget) {
                const nameInput = app.root.querySelector("[data-custom-name]");
                const prioritySelect = app.root.querySelector("[data-custom-priority]");
                const name = (nameInput.value || "").trim();
                if (!name) {
                    nameInput.focus();
                    return;
                }
                if (name.length > 64) {
                    nameInput.value = name.slice(0, 64);
                }
                const priority = parseInt(prioritySelect.value, 10) || 0;
                const targets = app.state.settings.customTargets || (app.state.settings.customTargets = []);
                const existing = targets.find(function(t) {
                    return t.name.toLowerCase() === name.toLowerCase();
                });
                if (existing) {
                    existing.priority = priority;
                } else {
                    if (targets.length >= 32) {
                        return;
                    }
                    targets.push({ name: name, priority: priority });
                }
                app.profile = "custom";
                sendMessage("custom|add|" + name + "|" + priority);
                nameInput.value = "";
                render();
                return;
            }

            const customRemoveTarget = event.target.closest("[data-custom-remove]");
            if (customRemoveTarget) {
                const index = parseInt(customRemoveTarget.getAttribute("data-custom-remove"), 10);
                const targets = app.state.settings.customTargets || [];
                if (index >= 0 && index < targets.length) {
                    const removed = targets[index];
                    app.state.settings.customTargets = targets.filter(function(_, i) { return i !== index; });
                    app.profile = "custom";
                    sendMessage("custom|remove|" + removed.name);
                    render();
                }
                return;
            }

            const intervalChip = event.target.closest("[data-interval]");
            if (intervalChip) {
                updateNumericSetting("scanInterval", intervalChip.getAttribute("data-interval"));
                return;
            }
        });

        app.root.addEventListener("change", function(event) {
            const intervalInput = event.target.closest("[data-interval-input]");
            if (intervalInput) {
                updateNumericSetting("scanInterval", intervalInput.value);
                return;
            }

            const settingInput = event.target.closest("[data-setting]");
            if (!settingInput) {
                return;
            }
            updateSetting(settingInput.getAttribute("data-setting"), settingInput.checked);
        });

        app.root.addEventListener("input", function(event) {
            const intervalInput = event.target.closest("[data-interval-input]");
            if (intervalInput) {
                // 实时预览数值，不发送消息
                const raw = parseInt(intervalInput.value, 10);
                if (!isNaN(raw) && raw >= 5 && raw <= 300) {
                    app.state.settings.scanInterval = raw;
                    // 只更新提示文本，不触发完整 render 以避免输入框失焦
                    const hint = document.querySelector(".interval-hint");
                    if (hint) {
                        hint.innerHTML = '✨ 游戏每 <strong>' + raw + 's</strong> → ACE/平台每 <strong>' + (raw + 1) + 's</strong>（错峰 1s，对齐颗粒度）';
                    }
                    // 高亮匹配的预设
                    document.querySelectorAll(".interval-chip").forEach(function(el) {
                        el.classList.toggle("active", parseInt(el.getAttribute("data-interval"), 10) === raw);
                    });
                }
            }
        });

        app.root.addEventListener("mousedown", function(event) {
            if (!app.isNative) {
                return;
            }

            const dragTarget = event.target.closest("[data-window-drag]");
            if (!dragTarget) {
                return;
            }

            if (event.target.closest("button, input, label, [data-no-drag]")) {
                return;
            }

            sendWindowCommand("drag");
        });

        if (app.isNative) {
            window.chrome.webview.addEventListener("message", function(event) {
                if (event.data && event.data.type === "state" && event.data.payload) {
                    mergeState(event.data.payload);
                    render();
                }
            });
            window.chrome.webview.postMessage("ready");
        }

        render();
    </script>
</body>
</html>
